%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/rockchip,rk915.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip RK915 SDIO Wi-Fi chip

maintainers:
  - sunshineinabox <aqemail@gmail.com>

description: >
  The Rockchip RK915 is a low-power 2.4 GHz IEEE 802.11b/g/n Wi-Fi chip
  attached over SDIO.

  The chip signals data interrupts through an out-of-band "host-wake"
  GPIO rather than the in-band SDIO interrupt, and requires a continuous
  SDIO clock. The node must be a child of an MMC/SDIO host controller
  node; the host controller node should carry keep-power-in-suspend and
  non-removable, and typically references an mmc-pwrseq node driving the
  chip's enable GPIO.

allOf:
  - $ref: ieee80211.yaml#

properties:
  compatible:
    const: rockchip,rk915

  reg:
    const: 1
    description: SDIO function number

  interrupts:
    maxItems: 1
    description: out-of-band host-wake interrupt

  interrupt-names:
    const: host-wake

  local-mac-address: true

  mac-address: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    mmc {
        #address-cells = <1>;
        #size-cells = <0>;

        cap-sd-highspeed;
        cap-sdio-irq;
        keep-power-in-suspend;
        max-frequency = <50000000>;
        mmc-pwrseq = <&sdio_pwrseq>;
        no-mmc;
        no-sd;
        non-removable;

        wifi@1 {
            compatible = "rockchip,rk915";
            reg = <1>;
            interrupt-parent = <&gpio0>;
            interrupts = <5 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "host-wake";
        };
    };
